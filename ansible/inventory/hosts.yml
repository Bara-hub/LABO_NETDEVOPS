---
all:
  children:
    vault:
      children:
        ios:
        asa:
    routers:
      children:
        edge:
        core:
    ios:
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.ios.ios
        ansible_network_cli_ssh_type: paramiko
        ansible_libssh_key_exchange_algorithms: "+diffie-hellman-group14-sha1"
        ansible_libssh_hostkeys: "ssh-rsa"
        ansible_user: "{{ lookup('env', 'IOS_USERNAME') | default(vault_ansible_user | default('ansible'), true) }}"
        ansible_password: "{{ lookup('env', 'IOS_PASSWORD') | default(vault_ansible_password | default('Rhocj@4319'), true) }}"
      children:
        edge:
          hosts:
            R-EDGE:
              ansible_host: 10.10.0.9
        core:
          hosts:
            R-CORE:
              ansible_host: 10.10.0.2
    asa:
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.asa.asa
        ansible_network_cli_ssh_type: paramiko
        ansible_libssh_key_exchange_algorithms: "+diffie-hellman-group14-sha1"
        ansible_libssh_hostkeys: "ssh-rsa"
        ansible_user: "{{ lookup('env', 'ASA_USERNAME') | default(vault_ansible_user | default('ansible'), true) }}"
        ansible_password: "{{ lookup('env', 'ASA_PASSWORD') | default(vault_ansible_password | default('Rhocj@4319'), true) }}"
      children:
        firewalls:
          hosts:
            FW-EDGE:
              ansible_host: 192.168.110.30
    linux:
      children:
        pc:
          hosts:
            PC-USER:
              ansible_host: 10.10.10.10
